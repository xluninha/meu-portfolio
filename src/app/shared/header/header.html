<!-- Legenda
 <nav> (Navigation): É a tag semântica que avisa ao navegador e aos leitores de tela que aquele bloco contém os links de navegação principal do site.

<ul> (Unordered List): É uma lista não ordenada (uma lista de itens com pontinhos/bullets por padrão, sem numeração).

<li> (List Item): É cada item individual dentro dessa lista.

<a> (Âncora): É a tag de link propriamente dita, responsável por tornar o texto clicável.-->
